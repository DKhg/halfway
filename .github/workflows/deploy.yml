# main에 push되면: 테스트 → 백엔드/프론트 이미지 빌드해서 Docker Hub에 push → EC2에 SSH 접속해서 재배포
# 서버는 소스코드를 받지 않고(git clone 없음), 이미 완성된 이미지를 pull만 해서 실행함
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md" # 루트 CLAUDE.md 등 문서만 바뀐 경우엔 배포 안 돎
      - ".github/screenshots/**" # README용 스크린샷만 바뀐 경우엔 배포 안 돎

# 짧은 간격으로 두 번 push되어도 배포가 겹쳐서 꼬이지 않게, 앞 배포가 끝날 때까지 다음 배포를 큐에 둠
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: halfway
          POSTGRES_USER: halfway
          POSTGRES_PASSWORD: halfway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 백엔드 테스트
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/halfway
          SPRING_DATASOURCE_USERNAME: halfway
          SPRING_DATASOURCE_PASSWORD: halfway
        run: ./gradlew test --no-daemon

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 프론트 빌드
        working-directory: frontend
        run: npm run build
      - name: 린트
        working-directory: frontend
        run: npm run lint

  # 테스트·빌드 둘 다 통과해야만 이미지 빌드·배포로 넘어감 (깨진 코드가 운영에 올라가는 걸 막음)
  build-and-push:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache-from/cache-to(type=gha)를 쓰려면 기본 빌더가 아니라 buildx 빌더가 필요함
      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 백엔드 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # latest는 "지금 운영에 떠야 할 버전", 커밋 SHA 태그는 "이 버전이 정확히 뭐였는지" 나중에 추적·수동 롤백용
          tags: |
            khongg/halfway-backend:latest
            khongg/halfway-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 프론트 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            khongg/halfway-frontend:latest
            khongg/halfway-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.prod.yml을 로컬에서 고쳐도 EC2엔 자동으로 안 퍼지던 문제를 막기 위해,
      # 배포 때마다 레포의 최신 버전으로 덮어씀 (ledger 프로젝트에서 이걸 안 해서 환경변수 미반영 사고가 있었음)
      - name: EC2 - docker-compose.prod.yml 동기화
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/"
          overwrite: true

      - name: EC2에 SSH로 접속해서 재배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
