# PR 올릴 때마다: 백엔드 테스트 + 프론트 빌드·린트를 자동으로 돌려서, 리뷰 전에 깨진 코드 미리 걸러냄
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # ./gradlew test가 @SpringBootTest로 실제 DB에 접속하므로, CI 러너 안에 임시 Postgres를 띄워서 씀
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: halfway
          POSTGRES_USER: halfway
          POSTGRES_PASSWORD: halfway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 백엔드 테스트
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/halfway
          SPRING_DATASOURCE_USERNAME: halfway
          SPRING_DATASOURCE_PASSWORD: halfway
        run: ./gradlew test --no-daemon

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 프론트 빌드
        working-directory: frontend
        run: npm run build
      - name: 린트
        working-directory: frontend
        run: npm run lint
