spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: halfway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halfway}
    username: ${SPRING_DATASOURCE_USERNAME:halfway}
    password: ${SPRING_DATASOURCE_PASSWORD:halfway}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # 휴대폰으로 찍은 영수증 사진 업로드용. 이미지는 저장 안 하고 Gemini 호출 한 번에만 씀
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

external:
  seoul-open-data:
    general-key: ${SEOUL_OPEN_DATA_GENERAL_KEY:}
    subway-key: ${SEOUL_OPEN_DATA_SUBWAY_KEY:}
  tago:
    key: ${TAGO_SERVICE_KEY:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}