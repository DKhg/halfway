# 80번 포트: 인증서 갱신용 경로만 허용, 나머지는 전부 443(HTTPS)으로 리다이렉트
server {
    listen 80;

    # Let's Encrypt가 도메인 소유 확인을 위해 이 경로로 요청함. 갱신 때도 똑같이 쓰이니 계속 열어둠
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443번 포트: 실제 서비스
server {
    listen 443 ssl;
    http2 on;
    server_name xn--2z1bo4m2odm3f.kr;

    ssl_certificate /etc/letsencrypt/live/xn--2z1bo4m2odm3f.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--2z1bo4m2odm3f.kr/privkey.pem;

    root /usr/share/nginx/html;

    # Vite가 JS/CSS 파일명에 컨텐츠 해시를 붙여주므로(예: index-CB4_nG7l.js), 내용이 바뀌면
    # 파일명도 같이 바뀐다. 즉 같은 파일명이면 내용도 항상 같다는 뜻이라 영구 캐시해도 안전함
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # workbox 런타임도 파일명에 해시가 붙어있어(workbox-9c191d2f.js) 위와 동일하게 영구 캐시 가능
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 서비스워커·등록 스크립트는 파일명이 안 바뀌므로, 브라우저가 캐시에 기대지 않고 매번
    # 서버에 재검증(304 조건부 GET)하게 해야 새 버전 배포를 바로 감지할 수 있음
    location ~* ^/(sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 안드로이드 App Links 인증용. 기본 mime.types엔 .json이 없어서 Content-Type을 직접 지정해야
    # 안드로이드가 검증 응답을 올바르게 파싱함
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # index.html은 배포의 진입점. 캐싱되면 새로 배포한 에셋 해시를 못 찾고 예전 버전을 계속 보여주게 됨
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 아이콘류는 해시가 없는 파일명이라 영구 캐시는 위험하지만(교체돼도 그대로 캐싱됨), 자주 안
    # 바뀌는 파일이라 하루 정도만 캐싱
    location ~* \.(png|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # 정적 파일(React 빌드 결과물) 서빙 경로
    location / {
        # SPA(Single Page App) 라우팅 처리: 사용자가 /room/ABC1234 같은 경로로 "새로고침"하면
        # 실제로 그 경로에 파일이 없어서 그냥 두면 404가 남. try_files가 해당 경로의 실제 파일을
        # 못 찾으면 index.html로 대신 돌려줘서, React Router가 그 안에서 라우팅을 처리하게 함
        try_files $uri /index.html;
    }

    # 프론트에서 axios로 보내는 /api/... 요청을 백엔드 컨테이너로 전달 (리버스 프록시)
    # axios.js의 baseURL 기본값이 '/api'라서, 프론트는 그냥 상대경로로 호출하고
    # 실제 백엔드 서버 주소(api:8080)는 여기 Nginx 설정에만 알고 있으면 됨 → 프론트 코드에 서버 주소 하드코딩 불필요
    location /api/ {
        # "api"는 docker-compose.prod.yml에서 백엔드 컨테이너에 붙일 서비스 이름과 반드시 같아야 함
        # (Docker 내장 DNS가 서비스 이름을 컨테이너의 내부 IP로 바꿔줌)
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        # 원래 요청자의 IP를 백엔드까지 전달 (안 넘기면 백엔드 입장에선 모든 요청이 Nginx의 내부 IP에서 온 것처럼 보임)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 백엔드 CORS 설정(app.cors.allowed-origins)이 Origin 헤더로 https 도메인을 판단하므로 그대로 전달
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
